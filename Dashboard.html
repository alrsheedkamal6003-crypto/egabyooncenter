<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إدارة الشهادات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-body); color: #334155; }

        /* ================= شاشة تسجيل الدخول ================= */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: var(--white); padding: 40px; border-radius: 15px;
            width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }
        .login-box h2 { margin-bottom: 25px; color: var(--primary); }
        .login-box input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 8px; outline: none;
        }
        .login-box button {
            width: 100%; padding: 12px; background: var(--secondary);
            border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer;
        }

        /* ================= الهيكل الرئيسي للمدير ================= */
        .dashboard-container { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width); background: var(--primary);
            color: white; padding: 30px 20px; position: fixed; height: 100%;
        }
        .sidebar h2 { font-size: 1.5rem; margin-bottom: 40px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .sidebar-link {
            display: flex; align-items: center; gap: 10px; padding: 12px;
            color: #cbd5e1; border-radius: 8px; margin-bottom: 10px; transition: 0.3s; cursor: pointer;
        }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,0.1); color: white; }

        /* Main Content */
        .main-content { margin-right: var(--sidebar-width); flex: 1; padding: 40px; }
        .header-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 15px; }
        .stat-card i { font-size: 2.5rem; color: var(--primary); opacity: 0.2; }

        /* Form Card */
        .form-card { background: white; padding: 30px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; font-family: 'Cairo'; }

        .btn-add { background: var(--primary); color: white; padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }

        /* Table Area */
        .table-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #f1f5f9; padding: 15px; font-weight: 700; }
        td { padding: 15px; border-top: 1px solid #f1f5f9; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .badge-ready { background: #dcfce7; color: var(--success); }
        .badge-pending { background: #fef3c7; color: var(--secondary); }
        .badge-delivered { background: #f1f5f9; color: #64748b; }
        .btn-delete { color: var(--danger); cursor: pointer; border: none; background: none; font-size: 1.1rem; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-right: 0; padding: 15px; }
            .grid-inputs { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginOverlay">
        <div class="login-box">
            <i class="fas fa-lock-open" style="font-size: 3rem; color: var(--secondary); margin-bottom: 15px;"></i>
            <h2>دخول المسؤول</h2>
            <input type="text" id="adminUser" placeholder="اسم المستخدم">
            <input type="password" id="adminPass" placeholder="كلمة المرور">
            <button onclick="checkLogin()">دخول للوحة التحكم</button>
            <p id="loginError" style="color: var(--danger); margin-top: 10px; display: none;">البيانات غير صحيحة!</p>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- القائمة الجانبية -->
        <aside class="sidebar">
            <h2>إيجابيون للتدريب</h2>
            <div class="sidebar-link active"><i class="fas fa-home"></i> الرئيسية</div>
            <div class="sidebar-link"><i class="fas fa-award"></i> إدارة الشهادات</div>
            <div class="sidebar-link"><i class="fas fa-users"></i> قاعدة المتدربين</div>
            <div class="sidebar-link" onclick="location.reload()" style="margin-top: 50px; color: var(--danger);"><i class="fas fa-sign-out-alt"></i> خروج</div>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <div class="header-stats">
                <div class="stat-card">
                    <i class="fas fa-file-invoice"></i>
                    <div><h4 id="countAll">0</h4><p>إجمالي الشهادات</p></div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-circle" style="color: var(--success); opacity: 0.5;"></i>
                    <div><h4 id="countReady">0</h4><p>جاهزة للاستلام</p></div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-spinner" style="color: var(--secondary); opacity: 0.5;"></i>
                    <div><h4 id="countPending">0</h4><p>قيد المعالجة</p></div>
                </div>
            </div>

            <!-- نموذج الإضافة -->
            <div class="form-card">
                <h3 style="margin-bottom: 20px;"><i class="fas fa-plus-circle"></i> إضافة شهادة جديدة</h3>
                <form id="certForm">
                    <div class="grid-inputs">
                        <div class="input-group">
                            <label>اسم المتدرب الرباعي</label>
                            <input type="text" id="sName" required placeholder="مثال: محمد أحمد علي حسن">
                        </div>
                        <div class="input-group">
                            <label>اسم الدورة</label>
                            <input type="text" id="sCourse" required placeholder="مثال: تحليل البيانات SPSS">
                        </div>
                        <div class="input-group">
                            <label>رقم الشهادة (ID)</label>
                            <input type="text" id="sId" required placeholder="EJ-2026-XXXX">
                        </div>
                        <div class="input-group">
                            <label>حالة الشهادة</label>
                            <select id="sStatus">
                                <option value="ready">جاهزة للاستلام</option>
                                <option value="pending">قيد التجهيز</option>
                                <option value="delivered">تم التسليم</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-add">حفظ البيانات وإصدار الشهادة</button>
                </form>
            </div>

            <!-- جدول البيانات -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>رقم الشهادة</th>
                            <th>اسم المتدرب</th>
                            <th>الدورة</th>
                            <th>الحالة</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- البيانات ستظهر هنا -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        // استيراد Firebase (نفس إعداداتك السابقة)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBOhmzUTvnzZuMR1-BrLGPvCFrbSm4IxdQ",
            authDomain: "egabyooncenter.firebaseapp.com",
            databaseURL: "https://egabyooncenter-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "egabyooncenter",
            storageBucket: "egabyooncenter.firebasestorage.app",
            messagingSenderId: "653897625239",
            appId: "1:653897625239:web:2ca62f17a0ab88129c03d2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const certsRef = ref(db, 'certificates');

        // --- نظام حماية بسيط ---
        window.checkLogin = function() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            if(user === "admin" && pass === "123456") {
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        // --- إضافة شهادة ---
        document.getElementById('certForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newCert = {
                id: document.getElementById('sId').value,
                name: document.getElementById('sName').value,
                course: document.getElementById('sCourse').value,
                status: document.getElementById('sStatus').value,
                date: new Date().toLocaleDateString('ar-EG')
            };
            push(certsRef, newCert);
            document.getElementById('certForm').reset();
            alert("تم إضافة الشهادة بنجاح");
        });

        // --- عرض الشهادات في الجدول وتحديث الإحصائيات ---
        onValue(certsRef, (snapshot) => {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = "";
            let all = 0, ready = 0, pending = 0;

            snapshot.forEach((child) => {
                const data = child.val();
                const key = child.key;
                all++;
                if(data.status === 'ready') ready++;
                if(data.status === 'pending') pending++;

                let statusClass = data.status === 'ready' ? 'badge-ready' : (data.status === 'pending' ? 'badge-pending' : 'badge-delivered');
                let statusText = data.status === 'ready' ? 'جاهزة' : (data.status === 'pending' ? 'قيد التجهيز' : 'تم التسليم');

                tbody.innerHTML += `
                    <tr>
                        <td><b>${data.id}</b></td>
                        <td>${data.name}</td>
                        <td>${data.course}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="btn-delete" onclick="deleteCert('${key}')"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('countAll').innerText = all;
            document.getElementById('countReady').innerText = ready;
            document.getElementById('countPending').innerText = pending;
        });

        // --- حذف شهادة ---
        window.deleteCert = function(key) {
            if(confirm("هل أنت متأكد من حذف هذه الشهادة نهائياً؟")) {
                remove(ref(db, 'certificates/' + key));
            }
        }
    </script>
</body>
</html>
